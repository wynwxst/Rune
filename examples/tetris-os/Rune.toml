[package]
name = "tetris"
version = "0.1.0"
edition = "2026"
description = "TETRIS-OS by jdah, ported to Rune: an operating system that only plays Tetris."
license = "MIT"

[build]
safety = "full"
memory = "zombie"
runtime = "none"
entry = "none"
target = "bare-x86"
# The kernel's entry and interrupt stubs, and the boot sector. Both are
# assembly for the reasons given at the top of each.
c-sources = ["boot/start.S", "boot/stage0.S"]
linker-script = "link.ld"

# `rune build` makes the kernel as an ELF file, and build.rune lays it out
# as a disk image; `rune run` boots that image from its own boot sector, with
# a SoundBlaster 16 and no audio output (change `-audiodev none` to `pa` or
# `coreaudio` to hear it). `{}` is where the image goes.
[target.bare-x86]
runner = "qemu-system-i386 -drive format=raw,file={} -audiodev none,id=snd -device sb16,audiodev=snd"

# The same, built with a GNU cross toolchain instead of clang and lld — the
# usual one on macOS (`brew install i686-elf-gcc i686-elf-binutils`):
#
#     rune run --target i686-elf
#
# Naming your own `cc` and `linker` is all it takes: none of clang's flags
# are added to tools that are not clang. `rune targets` lists exactly what
# each target compiles and links with.
[target.i686-elf]
base = "bare-x86"
cc = "i686-elf-gcc"
linker = "i686-elf-ld"
runner = "qemu-system-i386 -drive format=raw,file={} -audiodev none,id=snd -device sb16,audiodev=snd"
