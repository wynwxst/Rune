[package]
name = "basics"
version = "0.1.0"
edition = "2026"
description = ""
authors = []

[build]
# none | minimal | full — how much checking the compiler inserts.
safety = "full"
# zombie | arc — single ownership proven by the Zombie borrow
# checker with no counting at all, or reference counting.
memory = "zombie"
optimize = 0
debug = true
warnings-as-errors = false
target="bare-x86_64"
c-sources=["boot/boot.s"]
linker-script="kernel.ld"

[target.bare-x86_64]
#triple="i686-unknown-none-elf"
linker="ld.lld"
runner = "qemu-system-x86_64 -serial stdio -no-reboot -device isa-debug-exit,iobase=0xf4,iosize=0x04 -cdrom"
#link-args=["-mmx,-sse,+soft-float","-flavor gnu"]

[target.thumb]
triple="thumbv7m-none-eabi"
linker="ld.lld"
runner="qemu-system-arm -cpu cortex-m3 -machine lm3s6965evb -nographic -semihosting-config enable=on,target=native -kernel"
[dependencies]

# This package builds src/main.rune into an executable.
