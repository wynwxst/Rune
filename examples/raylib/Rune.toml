[package]
name = "raylib"
version = "0.1.0"
edition = "2026"
description = ""
authors = []

[build]
# none | minimal | full — how much checking the compiler inserts.
safety = "full"
# zombie | arc — single ownership proven by the Zombie borrow
# checker with no counting at all, or reference counting.
memory = "zombie"
optimize = 0
release = true
# make it pay attention
debug = false
warnings-as-errors = false
# make this macos specific in the file using #Config
link-args=["-framework","Cocoa","-framework","AppKit","-framework","OpenGL","-framework","IOKit","-framework","CoreFoundation"]

[dependencies]

# This package builds src/main.rune into an executable.
