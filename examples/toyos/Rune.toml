[package]
name = "toyos"
version = "0.1.0"
edition = "2026"
description = "A toy operating system in Rune: a multiboot kernel for 32-bit x86, booted by QEMU."

[build]
# `#runtime(none)` in src/main.rune says this too; the manifest says it for
# anyone reading it first. The whole checking dial stays up: bounds,
# overflow, division by zero, nil and the Zombie borrow checker all apply
# to kernel code as to any other.
safety = "full"
memory = "zombie"
runtime = "none"
entry = "none"
target = "bare-x86"
# Everything before `kernel_main`: the multiboot header, a stack, the call.
c-sources = ["boot/boot.s"]
linker-script = "kernel.ld"

# The foreign target `bare-x86`, run with QEMU's debug-exit device so a
# panic ends the run with a status of its own.
[target.bare-x86]
linker="ld.lld"
runner = "qemu-system-i386 -display none -serial stdio -no-reboot -device isa-debug-exit,iobase=0xf4,iosize=0x04 -kernel"

# The same, built with a GNU cross toolchain instead of clang and lld — the
# usual one on macOS (`brew install i686-elf-gcc i686-elf-binutils`):
#
#     rune run --target i686-elf
#
# Naming your own `cc` and `linker` is all it takes: none of clang's flags
# are added to tools that are not clang, and `kernel.ld` is handed to the
# linker as `-T kernel.ld`. `rune targets` lists exactly what each target
# compiles and links with.
[target.i686-elf]
base = "bare-x86"
cc = "i686-elf-gcc"
linker = "i686-elf-ld"
runner = "qemu-system-i386 -display none -serial stdio -no-reboot -device isa-debug-exit,iobase=0xf4,iosize=0x04 -kernel"
