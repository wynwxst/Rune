[package]
name = "webserver"
version = "0.1.0"
edition = "2025"
description = "A multi-threaded HTTP server over std::net and std::thread"
authors = []

[build]
# none | minimal | full — how much checking the compiler inserts.
#
# `full` is what this package wants: the connections it passes around own
# file descriptors, and the ownership pass is what makes handing one to a
# worker a move rather than a second owner of the same descriptor.
safety = "full"
optimize = 0
debug = true
warnings-as-errors = false

[dependencies]
