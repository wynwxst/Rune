[package]
name = "ObjectiveC"
version = "0.1.0"
edition = "2026"
description = ""
authors = []

[build]
# none | minimal | full — how much checking the compiler inserts.
safety = "full"
# arc | zombie — reference counting, or single ownership proven by
# the Zombie borrow checker with no counting at all.
memory = "zombie"
optimize = 0
debug = true
warnings-as-errors = false
link-args = ["-framework","Cocoa", "-g"]

[dependencies]

