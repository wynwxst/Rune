# Release builds of the Rune toolchain for macOS, Linux and Windows.
#
# Every platform builds the same way: a static LLVM with Rune's five
# backends and no optional dependencies (scripts/build-llvm.sh, cached
# between runs), then Rune against it, tested and packed as an archive that
# works wherever it is unpacked (scripts/package.sh).
#
# A tag `v*` publishes the archives as a GitHub release; any other run keeps
# them as workflow artifacts. rune-ffi is not built: it needs libclang, and
# `rune ffi` builds it on the user's machine the first time it is run.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: >-
          Which platforms to build: "all", or a comma-separated list of
          macos-arm64, macos-x86_64, linux-x86_64, linux-arm64, windows-x86_64
          (a word such as "windows" or "linux" picks every match)
        default: all

permissions:
  contents: write

env:
  LLVM_VERSION: "22.1.4"

jobs:
  # Which jobs a manual run builds. A tag always builds everything.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      unix: ${{ steps.pick.outputs.unix }}
      windows: ${{ steps.pick.outputs.windows }}
    steps:
      - id: pick
        env:
          WANT: ${{ github.event.inputs.platforms || 'all' }}
        run: |
          all='[
            {"platform":"macos-arm64","runner":"macos-14"},
            {"platform":"macos-x86_64","runner":"macos-13"},
            {"platform":"linux-x86_64","runner":"ubuntu-24.04","container":"quay.io/pypa/manylinux_2_28_x86_64"},
            {"platform":"linux-arm64","runner":"ubuntu-24.04-arm","container":"quay.io/pypa/manylinux_2_28_aarch64"}
          ]'
          want() {
            [[ "$WANT" == all || "$GITHUB_REF" == refs/tags/v* ]] && return 0
            local w
            for w in ${WANT//,/ }; do [[ "$1" == *"$w"* ]] && return 0; done
            return 1
          }
          picked='[]'
          for p in $(echo "$all" | jq -r '.[].platform'); do
            if want "$p"; then
              picked=$(jq -c --argjson all "$all" --arg p "$p" '. + [$all[] | select(.platform == $p)]' <<<"$picked")
            fi
          done
          echo "unix=$picked" >> "$GITHUB_OUTPUT"
          if want windows-x86_64; then echo "windows=true" >> "$GITHUB_OUTPUT"; else echo "windows=false" >> "$GITHUB_OUTPUT"; fi

  unix:
    name: ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.unix != '[]'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # An old glibc on Linux, so the binaries run on any distribution
        # newer than it; everything but the C library is linked in.
        include: ${{ fromJSON(needs.plan.outputs.unix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          pipx install cmake || python3 -m pip install cmake
          pipx install ninja || python3 -m pip install ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cached LLVM
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: llvm-install
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.platform }}-${{ hashFiles('scripts/build-llvm.sh') }}

      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/build-llvm.sh "$LLVM_VERSION" "$PWD/llvm-install"

      # Saved here, not in the cache action's post step, which only runs when
      # the whole job succeeds: a later failure must not throw LLVM away.
      - name: Save LLVM cache
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: llvm-install
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.platform }}-${{ hashFiles('scripts/build-llvm.sh') }}

      - name: Build, test and pack
        shell: bash
        run: scripts/package.sh "$PWD/llvm-install" "${{ steps.version.outputs.version }}" "${{ matrix.platform }}"

      - uses: actions/upload-artifact@v4
        with:
          name: rune-${{ matrix.platform }}
          path: dist/*.tar.gz

  windows:
    name: windows-x86_64
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # MinGW-w64 GCC: what builds Rune, and what `runec` links programs
      # with on Windows (it looks for `cc`/`gcc` on PATH).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            p7zip curl tar xz

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cached LLVM
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: llvm-install
          key: llvm-${{ env.LLVM_VERSION }}-windows-x86_64-${{ hashFiles('scripts/build-llvm.sh') }}

      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: scripts/build-llvm.sh "$LLVM_VERSION" "$PWD/llvm-install"

      # Saved here, not in the cache action's post step, which only runs when
      # the whole job succeeds: a later failure must not throw LLVM away.
      - name: Save LLVM cache
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: llvm-install
          key: llvm-${{ env.LLVM_VERSION }}-windows-x86_64-${{ hashFiles('scripts/build-llvm.sh') }}

      # The test harness is written for a POSIX shell's view of processes;
      # its results on Windows are reported but do not stop the release.
      - name: Build and pack
        run: scripts/package.sh "$PWD/llvm-install" "${{ steps.version.outputs.version }}" windows-x86_64 --no-tests

      - name: Tests (informational)
        continue-on-error: true
        run: cd build-release-windows-x86_64 && ctest --output-on-failure -j4 -R rune_end_to_end

      - uses: actions/upload-artifact@v4
        with:
          name: rune-windows-x86_64
          path: dist/*.zip

  publish:
    name: publish
    needs: [unix, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
